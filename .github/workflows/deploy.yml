name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Copy dist to root for GitHub Pages
        run: |
          cp dist/index.html index.html
          cp -r dist/assets .
          cp dist/.nojekyll .nojekyll
          cp dist/favicon.svg favicon.svg
          cp dist/icons.svg icons.svg

      - name: Commit and push built files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html assets favicon.svg icons.svg .nojekyll
          git commit -m "Auto: Deploy built app to GitHub Pages" || echo "No changes to commit"
          git push

